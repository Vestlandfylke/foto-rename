# ABOUTME: Byggjer Windows-installasjonsfila og legg ho som eit release-utkast på GitHub når ein versjons-tag blir pusha.
# ABOUTME: Kan òg køyrast manuelt for å testbyggje utan å publisere noko.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # Installasjonsfila og latest.yml får versjonen sin frå package.json, ikkje frå taggen.
      # Er dei ulike, ville brukarane fått tilbod om ein versjon som ikkje finst.
      - name: Sjekk at taggen stemmer med package.json
        if: github.ref_type == 'tag'
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          if ($tag -ne $pkg) {
            throw "Taggen er $tag, men package.json seier $pkg. Oppdater versjonen og lag taggen på nytt."
          }
          Write-Host "Versjon $pkg"

      - name: Installer npm-avhengnader
        run: npm ci

      - name: Byggje Python-runtime
        run: .\scripts\build-runtime.ps1

      - name: Byggje installasjonsfil
        run: npm run dist

      # electron-builder si eiga GitHub-publisering lastar opp filene parallelt og avsluttar
      # med kode 0 sjølv når ei av dei aldri kom fram, så releasen blir halv utan at jobben
      # blir raud. Difor byggjer me utan publisering og legg filene ved sjølve, i eitt steg.
      - name: Leggje filene på release-utkastet
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Steget nyttar exit-koden frå "gh release view" som eit svar, ikkje som ein feil:
          # ein release som ikkje finst enno er det normale. Denne lina slår difor eksplisitt
          # av at exit-kodar frå eksterne program blir terminerande feil, sidan GitHub set
          # ErrorActionPreference til Stop og standardverdien her kan endre seg mellom
          # pwsh-versjonar. Kvart kall blir sjekka med $LASTEXITCODE i staden.
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = "${{ github.ref_name }}"
          $versjon = (Get-Content package.json | ConvertFrom-Json).version
          $exe = "dist\NB-foto-namngivar-Setup-$versjon.exe"
          $filer = @($exe, "$exe.blockmap", "dist\latest.yml")
          foreach ($fil in $filer) {
            if (-not (Test-Path $fil)) { throw "Bygget mangla $fil." }
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $filer --clobber
          } else {
            gh release create $tag --draft --title $tag --generate-notes $filer
          }
          if ($LASTEXITCODE -ne 0) { throw "Klarte ikkje leggje filene på releasen." }

      # Utan denne sjekken kan ein manglande fil passere som ei vellukka køyring, og
      # feilen dukkar fyrst opp hos brukaren som ikkje får oppdatering.
      - name: Sjekk at releasen har alle filene
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $versjon = (Get-Content package.json | ConvertFrom-Json).version
          $venta = @(
            "NB-foto-namngivar-Setup-$versjon.exe",
            "NB-foto-namngivar-Setup-$versjon.exe.blockmap",
            "latest.yml"
          )
          $liggjer = (gh release view $tag --json assets | ConvertFrom-Json).assets.name
          $manglar = $venta | Where-Object { $liggjer -notcontains $_ }
          if ($manglar) { throw "Releasen manglar: $($manglar -join ', ')" }
          Write-Host "Releasen har $($liggjer -join ', ')"

      # Ved manuell køyring: last ned installasjonsfila frå denne sida for å teste henne.
      - name: Ta vare på installasjonsfila
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: installasjonsfil
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
          if-no-files-found: error
