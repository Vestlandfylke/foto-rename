<!doctype html>
<!-- ABOUTME: Framdriftsvindauge for installasjon av GPU-akselerasjon, med rå pip-utskrift. -->
<!-- ABOUTME: Hovudprosessen matar inn tekst via window.pushChunk, som handterer \r frå framdriftslinjer. -->
<html lang="nn">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
<title>Installerer GPU-akselerasjon</title>
<style>
  :root { --brand: #0A3258; --border: #e2e8f0; --muted: #5b6b82; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: #eef2f7; color: #0f1b2d; user-select: none;
    font: 14px/1.5 -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  header { display: flex; align-items: center; gap: 14px; padding: 16px 20px; background: var(--brand); color: #fff; }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; }
  header p { margin: 2px 0 0; font-size: 12px; color: rgba(255,255,255,.72); }
  .spinner {
    flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.22); border-top-color: #fff;
    animation: spin 900ms linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  main { flex: 1; padding: 14px 20px 18px; display: flex; flex-direction: column; min-height: 0; }
  pre {
    flex: 1; margin: 0; padding: 12px; overflow: auto; min-height: 0;
    background: #fff; border: 1px solid var(--border); border-radius: 8px;
    font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-word;
    user-select: text;
  }
  footer { margin-top: 10px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <header>
    <div class="spinner"></div>
    <div>
      <h1>Installerer GPU-akselerasjon</h1>
      <p>Lastar ned torch med CUDA. Dette er 2 til 3 GB og tek typisk 5 til 15 minutt.</p>
    </div>
  </header>
  <main>
    <pre id="log"></pre>
    <footer>Du kan lukke dette vindauget for å avbryte. Appen held fram på CPU.</footer>
  </main>
<script>
  const out = document.getElementById('log');
  let lines = [''];
  let queued = false;

  function render() {
    queued = false;
    out.textContent = lines.join('\n');
    out.scrollTop = out.scrollHeight;
  }

  // pip skriv framdriftslinja med vognretur (\r) i staden for linjeskift, så \r
  // betyr at den gjeldande linja skal skrivast over.
  window.pushChunk = (text) => {
    for (const part of text.split(/(\r\n|\n|\r)/)) {
      if (part === '\n' || part === '\r\n') lines.push('');
      else if (part === '\r') lines[lines.length - 1] = '';
      else if (part) lines[lines.length - 1] += part;
    }
    if (lines.length > 400) lines = lines.slice(-400);
    if (!queued) {
      queued = true;
      requestAnimationFrame(render);
    }
  };
</script>
</body>
</html>
