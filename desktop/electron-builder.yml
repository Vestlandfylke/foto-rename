# ABOUTME: Byggjekonfigurasjon for Windows-installasjonsfila (NSIS) til NB foto-namngivar.
# ABOUTME: Legg Python-runtime og nbrenamer-pakken ved sida av appen som resources/runtime og resources/backend.
appId: no.vestlandfylke.nbfotonamngivar
productName: NB foto-namngivar
copyright: Vestland fylkeskommune

directories:
  output: dist
  buildResources: build

# Oppdateringar blir henta frå GitHub-releases. Denne blokka fortel appen kvar han skal
# leite, og gjer at bygget lagar latest.yml og ei .blockmap-fil, som lèt appen berre laste
# ned dei delane av installasjonsfila som faktisk er endra. Sjølve opplastinga skjer i
# .github/workflows/release.yml, ikkje her: electron-builder si eiga publisering lastar opp
# parallelt og kan avslutte grønt med filer som manglar.
publish:
  provider: github
  owner: Vestlandfylke
  repo: foto-rename

files:
  - src/**/*
  - package.json

# Python-miljøet blir laga av scripts/build-runtime.ps1 før pakking.
extraResources:
  - from: runtime
    to: runtime
  - from: ../nbrenamer
    to: backend/nbrenamer
    filter:
      - "**/*"
      - "!__pycache__/**"

compression: maximum

win:
  target: nsis
  artifactName: NB-foto-namngivar-Setup-${version}.exe
  # Multi-storleik .ico laga av scripts/make_icons.py. Blir brukt av .exe-fila,
  # installasjonsprogrammet, avinstalleringa og snarvegane.
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NB foto-namngivar
  # Installasjonen inneheld eit stort Python-miljø, så avinstalleringa må rydde heile mappa.
  deleteAppDataOnUninstall: false
